<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM 성경 본문 정밀 석의 툴킷 v6.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .prompt-card { transition: all 0.2s ease-in-out; }
        .prompt-card:hover { transform: translateY(-3px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08); }
        .toast { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 32px; background: #0f172a; color: white; border-radius: 999px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); z-index: 100; font-weight: 600; }
        .highlight-text { color: #2563eb; font-weight: 700; border-bottom: 2px solid #bfdbfe; }
        .badge-ot { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .badge-nt { background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-5xl mx-auto">
        <!-- 헤더 -->
        <header class="mb-10 text-center">
            <div class="inline-block bg-slate-900 text-white px-4 py-1 rounded-full text-xs font-bold tracking-widest uppercase mb-3">v6.2 Refined Flow</div>
            <h1 class="text-4xl font-extrabold text-slate-900 mb-3 tracking-tight">NotebookLM 성경 본문 정밀 석의 툴킷</h1>
            <p class="text-slate-600 text-base">석의와 교리의 바른 순서를 정립하여 신구약 6단계 정밀 석의 프롬프트를 자동 생성합니다.</p>
        </header>

        <!-- 입력 및 모드 설정 카드 -->
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                <label for="passage-input" class="block text-sm font-bold text-slate-700">연구할 성경 본문 입력</label>
                <!-- 신구약 전환 토글 -->
                <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold text-slate-600">
                    <button id="mode-auto" onclick="setMode('auto')" class="px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-sm transition-all">자동 감지</button>
                    <button id="mode-ot" onclick="setMode('ot')" class="px-3 py-1.5 rounded-lg transition-all">구약 (OT)</button>
                    <button id="mode-nt" onclick="setMode('nt')" class="px-3 py-1.5 rounded-lg transition-all">신약 (NT)</button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="passage-input" placeholder="예: 창세기 1:1-5 또는 로마서 12:1-2" 
                       class="flex-1 px-5 py-4 bg-slate-50 border border-slate-300 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none text-lg font-medium transition-all"
                       oninput="updateAllPrompts()">
                <div class="flex items-center justify-center min-w-[160px] px-4 py-3 rounded-xl font-bold text-sm" id="testament-badge">
                    <span id="status-text">본문 입력 대기 중</span>
                </div>
            </div>
        </div>

        <!-- 프롬프트 그리드 (1~6단계) -->
        <div id="prompt-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

        <footer class="mt-16 text-center border-t border-slate-200 pt-8">
            <p class="text-slate-400 text-xs">© 2026 Reformed Exegesis Protocol v6.2 (Methodologically Ordered)</p>
        </footer>
    </div>

    <div id="toast" class="toast">복사 완료! NotebookLM 채팅창에 붙여넣으세요.</div>

    <script>
        // 구약 / 신약 약어 및 책명 DB
        const otBooks = [
            "창세기", "창", "출애굽기", "출", "레위기", "레", "민기", "민수기", "민", "신명기", "신", 
            "여호수아", "수", "사사기", "삿", "룻기", "룻", "사무엘상", "삼상", "사무엘하", "삼하", 
            "열왕기상", "왕상", "열왕기하", "왕하", "역대상", "역상", "역대하", "역하", "에스라", "스", 
            "느헤미야", "느", "에스더", "에", "욥기", "욥", "시편", "시", "잠언", "잠", "전도서", "전", 
            "아가", "아", "이사야", "사", "예레미야", "렘", "예레미야애가", "애", "에스겔", "겔", 
            "다니엘", "단", "호세아", "호", "요엘", "욜", "아모스", "암", "오바댜", "옵", "요나", "욘", 
            "미가", "미", "나훔", "나", "하박국", "합", "스바냐", "습", "학개", "학", "스가랴", "슥", "말라기", "말",
            "gen", "exod", "lev", "num", "deut", "josh", "judg", "ruth", "1sam", "2sam", "1kings", "2kings",
            "1chron", "2chron", "ezra", "neh", "esth", "job", "ps", "psalms", "prov", "eccl", "song", "isa",
            "jer", "lam", "ezek", "dan", "hos", "joel", "amos", "obad", "jonah", "mic", "nah", "hab", "zeph", "hag", "zech", "mal"
        ];

        const ntBooks = [
            "마태복음", "마태", "마", "마가복음", "마가", "막", "누가복음", "누가", "눅", "요한복음", "요한", "요", 
            "사도행전", "행", "로마서", "롬", "고린도전서", "고전", "고린도후서", "고후", "갈라디아서", "갈", 
            "에베소서", "엡", "빌립보서", "빌", "골로새서", "골", "데살로니가전서", "살전", "데살로니가후서", "살후", 
            "디모데전서", "딤전", "디모데후서", "딤후", "디도서", "딛", "빌레몬서", "몬", "히브리서", "히", 
            "야고보서", "약", "베드로전서", "벧전", "베드로후서", "벧후", "요한1서", "요일", "요한2서", "요이", 
            "요한3서", "요삼", "유다서", "유", "요한계시록", "계",
            "matt", "mark", "luke", "john", "acts", "rom", "1cor", "2cor", "gal", "eph", "phil", "col",
            "1thess", "2thess", "1tim", "2tim", "titus", "philem", "heb", "jas", "1pet", "2pet", "1john", "2john", "3john", "jude", "rev"
        ];

        // 1~6단계 석의 프롬프트 (구약용 - 개선판)
        const otPrompts = [
            { id: 1, category: "1단계", title: "신학적 비평 지형도 및 해석상 난제(Crux)", text: "제공된 자료를 바탕으로 [해당 본문]에 대한 주요 주석가/학자들의 신학적 학파와 접근법을 분류하고, 본문 해석상 가장 첨예하게 대립하는 핵심 난제(Crux Interpretum)를 논거와 함께 표 형식으로 정리하십시오." },
            { id: 2, category: "2단계", title: "원어·본문 비평 및 핵심 어휘 연구", text: "개역개정과 마소라 본문(MT)/칠십인역(LXX)을 대조하여 [해당 본문]의 번역상 뉘앙스 손실이나 오해의 소지를 지적하고, 사본학적 이슈(Ketiv/Qere, 주요 이문)를 설명하십시오. 아울러 문맥상 신학적으로 중요한 핵심 단어들의 원어 어근과 독특한 문맥적 함의를 추출하십시오." },
            { id: 3, category: "3단계", title: "문학적 구조, 문맥적 정점 및 서사 전략", text: "[해당 본문]의 문학적 장르와 교차대칭(Chiasmus), 평행법 등 세밀한 문학 구조를 분석하십시오. 교차대칭의 중심부(Center X)를 포함하여 앞뒤 문맥 속에서 본문의 '논리적/서사적 정점'이 어디인지 밝히고, 이 구조가 전달하는 수사학적 효과를 규명하십시오." },
            { id: 4, category: "4단계", title: "사회문화적 배경 및 역사적 한계선", text: "[해당 본문] 당시 고대 근동(ANE) 및 이스라엘의 사회문화적·지리적 배경을 규명하여, 현대적 사고방식을 투영하는 시대착오적 해석(Anachronism)을 차단하는 역사적 경계선을 제시하십시오. 아울러 구약 타 본문(오경, 시편 등)과의 정경적 상호텍스트적(Intertextual) 연관성을 고증하십시오." },
            { id: 5, category: "5단계", title: "구속사적 기독론 성취", text: "[해당 본문]이 단판적 도덕주의나 율법적 교훈으로 환원되지 않도록, 본문에 내포된 그림자/모형(Typology)과 언약적 흐름이 예수 그리스도의 성육신, 십자가 대속, 부활 사역에서 어떻게 성취되는지 복음 중심으로 정밀하게 연결하십시오." },
            { id: 6, category: "6단계", title: "교리적 정합성 검증 및 석의 주제 도출", text: "이상의 1~5단계 석의 결과를 바탕으로, 본 해석이 개혁주의 표준문서(WCF, 하이델베르크 요리문답 등)의 신학 체계와 조화를 이루는지 최종 점검하고 빠지기 쉬운 신학적/기복적 오류를 지적하십시오. 이를 총괄하여 [해당 본문]의 핵심 석의 명제를 '한 문장'으로 정립하고, 20자 이내의 강단 설교 주제안들을 문장 형태로 5가지 제시하십시오." }
        ];

        // 1~6단계 석의 프롬프트 (신약용 - 개선판)
        const ntPrompts = [
            { id: 1, category: "1단계", title: "신학적 비평 지형도 및 해석상 난제(Crux)", text: "제공된 자료를 바탕으로 [해당 본문]에 대한 주요 주석가/학자들의 신학적 학파와 비평적 입장을 분류하고, 본문 해석상 가장 첨예하게 대립하는 핵심 난제(Crux Interpretum)를 논거와 함께 표 형식으로 정리하십시오." },
            { id: 2, category: "2단계", title: "원어·본문 비평 및 핵심 어휘 연구", text: "개역개정과 헬라어 원문(NA28/UBS6)을 대조하여 [해당 본문]의 번역상 뉘앙스 손실이나 오해의 소지를 지적하고, 사본학적 이슈(주요 이문 Textual Variants, 주요 사본 증거)를 설명하십시오. 아울러 문맥상 신학적으로 중요한 핵심 단어의 헬라어 어근, 시제·구문론적 특징, 그리고 독특한 문맥적 함의를 추출하십시오." },
            { id: 3, category: "3단계", title: "문학적 구조, 문맥적 정점 및 수사학 전략", text: "[해당 본문]의 문학적 장르를 파악하고, 교차대칭(Chiasmus), 연행적 논증, 내러티브 흐름 등 세밀한 구조를 분석하십시오. (교차대칭 시 Center X를, 논증 구조 시 논리적 정점을 명시) 이 구조가 독자의 심리와 신학적 강조점에 미치는 수사학적 효과를 설명하십시오." },
            { id: 4, category: "4단계", title: "사회문화적 배경 및 역사적 한계선", text: "[해당 본문]에 관한 1세기 그레코-로만(Greco-Roman) 세계 및 제2성전 유대교(Second Temple Judaism)의 사회문화적·정치적 배경을 규명하여, 본문에 현대적 개념을 자의적으로 투영하는 시대착오적 오해를 차단하는 해석학적 가이드라인을 제시하십시오. 아울러 구약(칠십인역 LXX 인용/암시)과의 정경적 상호텍스트적 연관성을 고증하십시오." },
            { id: 5, category: "5단계", title: "구속사적 기독론 및 복음 중심적 해석", text: "[해당 본문]이 단순한 윤리적 훈계로 전락하지 않도록, 그리스도가 성취하신 구속 사역에 근거한 '구속사적 직설법(Indicative)'과 '윤리적 명령법(Imperative)'의 관계를 명확히 규명하십시오. 또한 '이미와 아직(Already-Not Yet)'의 구속사 흐름 속에서 그리스도를 삶의 동력(Power)으로 정밀하게 조명하십시오." },
            { id: 6, category: "6단계", title: "교리적 정합성 검증 및 석의 주제 도출", text: "이상의 1~5단계 석의 결과를 바탕으로, 본 해석이 개혁주의 표준문서(WCF, 하이델베르크 요리문답 등)의 정통 교리와 일치하는지 최종 확인하고 신학적 탈선이나 주술적 오용의 위험을 경고하십시오. 이를 총합하여 [해당 본문]의 핵심 석의 명제를 '한 문장'으로 정립하고, 20자 이내의 강단 설교 주제안들을 문장 형태로 5가지 제시하십시오." }
        ];

        let currentMode = 'auto'; // 'auto', 'ot', 'nt'

        function setMode(mode) {
            currentMode = mode;
            ['auto', 'ot', 'nt'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-sm transition-all font-bold";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800";
                }
            });
            updateAllPrompts();
        }

        function detectTestament(input) {
            if (currentMode === 'ot') return 'OT';
            if (currentMode === 'nt') return 'NT';

            const cleanInput = input.toLowerCase().replace(/\s+/g, '');
            if (!cleanInput) return 'NT';

            for (let b of otBooks) {
                if (cleanInput.includes(b)) return 'OT';
            }
            for (let b of ntBooks) {
                if (cleanInput.includes(b)) return 'NT';
            }
            return 'NT';
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function updateAllPrompts() {
            const passageInput = document.getElementById('passage-input');
            const passage = passageInput.value.trim() || "[해당 본문]";
            const testament = detectTestament(passageInput.value.trim());

            const badge = document.getElementById('testament-badge');
            const statusText = document.getElementById('status-text');

            if (passageInput.value.trim() === "") {
                badge.className = "flex items-center justify-center min-w-[160px] px-4 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-500";
                statusText.innerText = "본문 입력 대기 중";
            } else if (testament === 'OT') {
                badge.className = "flex items-center justify-center min-w-[160px] px-4 py-3 rounded-xl font-bold text-sm badge-ot";
                statusText.innerText = "구약(OT) 석의 가동";
            } else {
                badge.className = "flex items-center justify-center min-w-[160px] px-4 py-3 rounded-xl font-bold text-sm badge-nt";
                statusText.innerText = "신약(NT) 석의 가동";
            }

            renderCards(passage, testament);
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function renderCards(passage, testament) {
            const grid = document.getElementById('prompt-grid');
            grid.innerHTML = '';

            const exegesisPrompts = (testament === 'OT') ? otPrompts : ntPrompts;

            exegesisPrompts.forEach(p => {
                const updatedText = p.text.replace(/\[해당 본문\]/g, passage);
                const card = document.createElement('div');
                card.className = "prompt-card bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col";
                
                let displayText = updatedText;
                if (passage !== "[해당 본문]" && passage !== "") {
                    const safePassage = escapeRegExp(passage);
                    displayText = updatedText.replace(new RegExp(safePassage, 'g'), `<span class="highlight-text">${passage}</span>`);
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-extrabold px-2.5 py-1 rounded-md ${testament === 'OT' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'} tracking-wide">
                            ${p.category} ${testament === 'OT' ? '구약 석의' : '신약 석의'}
                        </span>
                        <button onclick="copyToClipboard(\`${updatedText}\`)" class="bg-slate-900 hover:bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-md">
                            복사
                        </button>
                    </div>
                    <p class="text-slate-900 font-bold mb-3 text-base leading-snug">${p.title}</p>
                    <div class="bg-slate-50 p-4 rounded-xl text-slate-600 text-sm leading-relaxed border border-slate-100 flex-grow">
                        ${displayText}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        updateAllPrompts();
    </script>
</body>
</html>
